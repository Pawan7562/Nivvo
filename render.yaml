services:
  - type: web
    name: nivvo-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
